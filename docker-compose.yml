# Project name is PINNED so Neon's containers and volumes never collide with any
# other local stack (Compose otherwise derives it from the folder name, and a
# rename would silently point at a new, empty volume).
name: neon

services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_DB: neon
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5435:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # Lets `docker-compose up -d --wait` block until Postgres actually accepts
    # connections. Without it the backend can start first and fail its initial
    # queries against a container that is running but not yet ready.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d neon"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6381:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
  redis_data:
