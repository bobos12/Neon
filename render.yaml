# Render Blueprint — Neon backend API + Redis on the free tier.
# Frontend runs on Vercel (neonhq.app); this API is api.neonhq.app.
# Postgres and media both live in Supabase: DATABASE_URL is the Supavisor
# *session* pooler (port 5432, IPv4 — Render has no IPv6 egress, and the
# transaction pooler breaks `prisma migrate deploy`); media uses Supabase
# Storage through its S3 API.
# Render → New → Blueprint → pick this repo. Values marked `sync: false` are
# prompted for on first deploy.
services:
  - type: web
    name: neon-backend
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./apps/backend/Dockerfile
    dockerContext: .
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: neon-redis
          property: connectionString
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: CREDENTIAL_ENCRYPTION_KEY
        sync: false
      - key: META_WEBHOOK_VERIFY_TOKEN
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: PUBLIC_API_URL
        sync: false
      - key: META_GRAPH_VERSION
        value: v24.0
      # One-click "Connect WhatsApp" (Meta Embedded Signup).
      - key: META_APP_ID
        sync: false
      - key: META_APP_SECRET
        sync: false
      - key: META_EMBEDDED_SIGNUP_CONFIG_ID
        sync: false
      - key: OWNER_EMAIL
        sync: false
      - key: OWNER_PASSWORD
        sync: false
      - key: OWNER_NAME
        sync: false
      - key: DEV_SUPERUSER_EMAIL
        sync: false
      - key: DEV_SUPERUSER_PASSWORD
        sync: false
      - key: S3_BUCKET
        sync: false
      - key: S3_REGION
        sync: false
      - key: S3_ENDPOINT
        sync: false
      - key: S3_PUBLIC_URL
        sync: false
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        sync: false
      - key: DEV_SUPERUSER_NAME
        value: Developer
      - key: WA_DEFAULT_REGION
        value: SA
      # Web push (browser notifications). Generate a pair with
      #   npx web-push generate-vapid-keys
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_SUBJECT
        sync: false

  - type: keyvalue
    name: neon-redis
    plan: free
    region: frankfurt
    # Bull queues must never have jobs evicted.
    maxmemoryPolicy: noeviction
    ipAllowList: []
